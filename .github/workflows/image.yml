name: Build interview image

on:
  push:
    branches: [main]
    paths: ["image/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: devcontainers/ci@v0.3
        with:
          subFolder: image
          imageName: ghcr.io/nicky164/interview-env
          imageTag: latest,${{ steps.sha.outputs.short }}
          cacheFrom: ghcr.io/nicky164/interview-env
          push: always
          runCmd: interview-env
